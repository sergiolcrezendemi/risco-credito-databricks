[project]
name = "risco-credito-databricks"
version = "0.1.0"
description = "Case de negocio ponta a ponta no Databricks"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "mlflow>=2.10",
    "databricks-sdk>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "pre-commit>=3.7"]

[tool.databricks.environment]
environment_version = "5"

[tool.ruff]
line-length = 100
target-version = "py311"
builtins = ["dbutils"]
force-exclude = true
extend-include = ["*.ipynb"]
extend-exclude = ["**/.temp/**",
    ".temp/**",
    "docs/**",
    ".temp_del/**",
     "notebooks/ead"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["F821", "E402", "I001"]
"scripts/**/*.py" = ["F821", "E402", "I001"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
