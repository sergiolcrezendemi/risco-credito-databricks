bundle:
  name: risco-credito-databricks

sync:
  exclude:
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/.temp/**"
    - "**/.temp_del/**"
    - ".ruff_cache/**"
    - ".git/**"


artifacts:
  default:
    type: whl
    build: python -m build
    path: .

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catálogo - Unity Catalog usado por este ambiente"
  simulation_mode:
    default: "true"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-13aa7517-c807.cloud.databricks.com
    variables:
      catalog: credito_dev

  hml:
    workspace:
      host: https://dbc-13aa7517-c807.cloud.databricks.com
    variables:
      catalog: credito_hml

  prd:
    mode: production
    workspace:
      host: https://dbc-13aa7517-c807.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: credito_prd