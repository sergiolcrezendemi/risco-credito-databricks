# resources/risco_credito_pipeline.yml
# ==============================================================================
# Job que orquestra o pipeline ponta a ponta.
# ==============================================================================

resources:
  jobs:
    risco_credito_pipeline:
      name: risco-credito-pipeline-${bundle.target}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - pandas>=2.0
              - numpy>=1.24
              - scikit-learn>=1.3
              - xgboost>=2.0
              - shap>=0.44
              - scipy>=1.10
              - mlflow>=2.10
              - databricks-sdk>=0.20
              - -e .

      tasks:
        - task_key: bronze_training
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/ingestao/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              dataset: training

        - task_key: bronze_scoring
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/ingestao/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              dataset: scoring

        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze_training
          notebook_task:
            notebook_path: ../notebooks/ingestao/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
              dataset: training

        - task_key: silver_scoring
          environment_key: default
          depends_on:
            - task_key: bronze_scoring
          notebook_task:
            notebook_path: ../notebooks/ingestao/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
              dataset: scoring

        - task_key: gold
          environment_key: default
          depends_on:
            - task_key: silver
            - task_key: silver_scoring
          notebook_task:
            notebook_path: ../notebooks/ingestao/03_gold.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: hipoteses_h1_h4
          environment_key: default
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/ml/01_hipoteses_h1_h4.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: vies_threshold_roi
          environment_key: default
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/ml/02_vies_threshold_roi.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: inferencia_batch
          environment_key: default
          depends_on:
            - task_key: vies_threshold_roi
          notebook_task:
            notebook_path: ../notebooks/ml/03_inferencia_batch.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: drift_dados
          environment_key: default
          depends_on:
            - task_key: inferencia_batch
          notebook_task:
            notebook_path: ../notebooks/monitoracao/01_drift_dados.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: concept_drift
          environment_key: default
          depends_on:
            - task_key: inferencia_batch
          notebook_task:
            notebook_path: ../notebooks/monitoracao/02_concept_drift.py
            base_parameters:
              catalog: ${var.catalog}
              simulation_mode: "true"
